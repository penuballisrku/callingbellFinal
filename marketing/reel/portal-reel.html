<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CallInBell Portal Reel</title>
<style>
  @font-face {
    font-family: 'CBInter';
    src: url('assets/inter.woff2') format('woff2');
    font-weight: 100 900;
  }
  html, body { margin: 0; height: 100%; background: #050b16; }
  body { display: grid; place-items: center; overflow: hidden; }
  canvas { height: 100vh; width: auto; max-width: 100vw; aspect-ratio: 9 / 16; display: block; }
  body.render canvas { height: auto; width: 1080px; max-width: none; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
/*
 * CallInBell — web portal advert, Instagram Reel (1080x1920, 44s).
 * Intro → hook → ten feature scenes (each with an animated phone mock-up) → recap → brand close with the website.
 * renderFrame(t) is a pure function of time; render.cjs --page portal exports it frame by frame.
 * Preview over http: portal-reel.html?play (or ?t=12.5 to hold a frame).
 */
const W = 1080, H = 1920, DUR = 44;
const FONT = "'CBInter', 'Segoe UI', Roboto, Arial, sans-serif";
const C = {
  navy: '#0B1220', amber: '#F4A62C', amberHi: '#FFC562', amberDeep: '#E08A0B',
  white: '#FFFFFF', muted: '#BAC5D4', faint: '#74839A',
  // phone UI (the portal's light theme)
  canvas: '#F7F8FA', line: '#E5E7EB', ink: '#161616', ink2: '#344054', gray: '#667085', faintUi: '#98A2B3',
  success: '#067647', successSoft: '#ECFDF3', accentSoft: '#FEF4E2', accentInk: '#93530A', info: '#1570EF', danger: '#B42318',
};

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

// ---------- maths ----------
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, p) => a + (b - a) * p;
const easeOutCubic = p => 1 - Math.pow(1 - p, 3);
const easeInCubic = p => p * p * p;
const easeInOutCubic = p => (p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2);
const easeOutBack = p => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const easeOutQuint = p => 1 - Math.pow(1 - p, 5);
const ringAngle = lt => (lt < 0 ? 0 : 0.32 * Math.sin(lt * 26) * Math.exp(-lt * 3.2));
function rand(seed) { const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

// ---------- icons (Lucide, ISC licence, 24x24) ----------
const ICONS = {
  zap: ['M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z'],
  wrench: ['M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z'],
  snowflake: ['M2 12h20', 'M12 2v20', 'm20 16-4-4 4-4', 'm4 8 4 4-4 4', 'm16 4-4 4-4-4', 'm8 20 4-4 4 4'],
  hammer: ['m15 12-8.373 8.373a1 1 0 1 1-3-3L12 9', 'm18 15 4-4', 'm21.5 11.5-1.914-1.914A2 2 0 0 1 19 8.172V7l-2.26-2.26a6 6 0 0 0-4.202-1.756L9 2.96l.92.82A6.18 6.18 0 0 1 12 8.4V10l2 2h1.172a2 2 0 0 1 1.414.586L18.5 14.5'],
  roller: [{ r: [2, 2, 16, 6, 2] }, 'M10 16v-2a2 2 0 0 1 2-2h8a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2', { r: [8, 16, 4, 6, 1] }],
  sparkles: ['M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z', 'M20 3v4', 'M22 5h-4', 'M4 17v2', 'M5 18H3'],
  washer: [{ r: [3, 2, 18, 20, 2] }, 'M3 6h18', 'M7 4h.01', 'M10 4h.01', { c: [12, 13.5, 5] }, 'M12 18.5a2.5 2.5 0 0 0 0-5 2.5 2.5 0 0 1 0-5'],
  house: ['M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8', 'M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'],
  scissors: [{ c: [6, 6, 3] }, 'M8.12 8.12 12 12', 'M20 4 8.12 15.88', { c: [6, 18, 3] }, 'M14.8 14.8 20 20'],
  book: ['M12 7v14', 'M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z'],
  search: [{ c: [11, 11, 8] }, 'm21 21-4.3-4.3'],
  pin: ['M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0', { c: [12, 10, 3] }],
  bell: ['M10.268 21a2 2 0 0 0 3.464 0', 'M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326'],
  phone: ['M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384'],
  chat: ['M7.9 20A9 9 0 1 0 4 16.1L2 22Z'],
  video: ['m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5', { r: [2, 6, 14, 12, 2] }],
  check: ['M20 6 9 17l-5-5'],
  image: [{ r: [3, 3, 18, 18, 2] }, { c: [9, 9, 2] }, 'm21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21'],
  globe: [{ c: [12, 12, 10] }, 'M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20', 'M2 12h20'],
  star: ['M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z'],
  tag: ['M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z', { c: [7.5, 7.5, 0.5] }],
  trending: ['M22 7 13.5 15.5 8.5 10.5 2 17', 'M16 7h6v6'],
  calendar: [{ r: [3, 4, 18, 18, 2] }, 'M16 2v4', 'M8 2v4', 'M3 10h18'],
  clock: [{ c: [12, 12, 10] }, 'M12 6v6l4 2'],
  store: ['M15 21v-5a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v5', 'M17.774 10.31a1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.451 0 1.12 1.12 0 0 0-1.548 0 2.5 2.5 0 0 1-3.452 0 1.12 1.12 0 0 0-1.549 0 2.5 2.5 0 0 1-3.77-3.248l2.889-4.184A2 2 0 0 1 7 2h10a2 2 0 0 1 1.653.873l2.895 4.192a2.5 2.5 0 0 1-3.774 3.244', 'M4 10.95V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8.05'],
  arrow: ['M5 12h14', 'm12 5 7 7-7 7'],
};
const PATHS = {};
for (const [k, parts] of Object.entries(ICONS)) {
  PATHS[k] = parts.map(p => {
    if (typeof p === 'string') return new Path2D(p);
    const path = new Path2D();
    if (p.r) path.roundRect(...p.r);
    if (p.c) path.arc(p.c[0], p.c[1], p.c[2], 0, Math.PI * 2);
    return path;
  });
}

// ---------- timeline ----------
const T_HOOK = 3.2;
const T_FEAT = 6.2;
const FEAT_D = 2.8;
const N_FEAT = 10;
const T_RECAP = T_FEAT + N_FEAT * FEAT_D;   // 34.2
const T_OUT = 37.6;

// ---------- primitives ----------
function font(weight, size) { ctx.font = `${weight} ${size}px ${FONT}`; }

function drawIcon(name, cx, cy, size, color, lw = 2, draw = 1) {
  if (draw <= 0) return;
  ctx.save();
  ctx.translate(cx - size / 2, cy - size / 2);
  ctx.scale(size / 24, size / 24);
  ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (draw < 1) { ctx.setLineDash([120, 120]); ctx.lineDashOffset = 120 * (1 - easeInOutCubic(draw)); }
  for (const p of PATHS[name]) ctx.stroke(p);
  ctx.restore();
}
function fillIcon(name, cx, cy, size, color) {
  ctx.save();
  ctx.translate(cx - size / 2, cy - size / 2);
  ctx.scale(size / 24, size / 24);
  ctx.fillStyle = color;
  for (const p of PATHS[name]) ctx.fill(p);
  ctx.restore();
}

// The CallInBell mark, from web/public/favicon.svg (40x40 units).
const BELL_TOP = new Path2D(); BELL_TOP.roundRect(18.9, 7.2, 2.2, 3.4, 1.1);
const BELL_BODY = new Path2D('M20 9.6c-4.5 0-7.5 3.4-7.5 7.7v4.8l-2.1 3.3c-.55.86.07 1.95 1.08 1.95h17.04c1.01 0 1.63-1.09 1.08-1.95l-2.1-3.3v-4.8c0-4.3-3-7.7-7.5-7.7Z');
const BELL_CLAPPER = new Path2D('M16.7 29.2h6.6a3.3 3.3 0 0 1-6.6 0Z');
const WAVE1 = new Path2D('M26.6 11.2a7 7 0 0 1 2.7 4.6');
const WAVE2 = new Path2D('M29.4 8.2a10.8 10.8 0 0 1 3.9 7');

function drawLogo(cx, cy, size, { ring = 0, waves = 1, glow = 1, alpha = 1 } = {}) {
  if (size <= 0 || alpha <= 0) return;
  const s = size / 40;
  ctx.save();
  ctx.globalAlpha *= alpha;
  ctx.translate(cx - 20 * s, cy - 20 * s);
  ctx.scale(s, s);
  ctx.save();
  if (glow > 0) { ctx.shadowColor = `rgba(244,166,44,${0.45 * glow})`; ctx.shadowBlur = 60 * glow * s; }
  const g = ctx.createLinearGradient(0, 0, 40, 40);
  g.addColorStop(0, '#1A2540'); g.addColorStop(1, C.navy);
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.roundRect(0, 0, 40, 40, 11); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = 'rgba(244,166,44,0.35)'; ctx.lineWidth = 0.5;
  ctx.beginPath(); ctx.roundRect(0.25, 0.25, 39.5, 39.5, 10.8); ctx.stroke();
  ctx.save();
  ctx.translate(20, 9); ctx.rotate(ring); ctx.translate(-20, -9);
  ctx.translate(-0.4, 1.2); ctx.scale(0.92, 0.92);
  ctx.fillStyle = C.white;
  ctx.fill(BELL_TOP); ctx.fill(BELL_BODY);
  ctx.save(); ctx.translate(20, 27); ctx.rotate(ring * 0.8); ctx.translate(-20, -27); ctx.fill(BELL_CLAPPER); ctx.restore();
  ctx.restore();
  ctx.strokeStyle = C.amber; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.globalAlpha = alpha * clamp(waves * 2);
  ctx.stroke(WAVE1);
  ctx.globalAlpha = alpha * 0.55 * clamp(waves * 2 - 1);
  ctx.stroke(WAVE2);
  ctx.restore();
}

// Text that slides up from behind a mask.
function revealText(txt, x, y, size, p, color) {
  if (p <= 0) return;
  ctx.save();
  ctx.beginPath(); ctx.rect(-W, y - size * 1.05, W * 3, size * 1.4); ctx.clip();
  ctx.globalAlpha *= clamp(p * 1.6);
  ctx.fillStyle = color;
  ctx.fillText(txt, x, y + (1 - easeOutQuint(clamp(p))) * size * 1.15);
  ctx.restore();
}

function drawWordmark(x, y, size, align, p = 1, alpha = 1, suffix = '') {
  if (p <= 0 || alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha *= alpha;
  font(800, size);
  ctx.letterSpacing = `${-size * 0.03}px`;
  ctx.textAlign = 'left';
  const w1 = ctx.measureText('CallIn').width, w2 = ctx.measureText('Bell').width, w3 = suffix ? ctx.measureText(suffix).width : 0;
  const x0 = align === 'center' ? x - (w1 + w2 + w3) / 2 : x;
  revealText('CallIn', x0, y, size, p, C.white);
  revealText('Bell', x0 + w1, y, size, seg(p, 0.15, 1.15), C.amber);
  if (suffix) revealText(suffix, x0 + w1 + w2, y, size, seg(p, 0.3, 1.3), C.white);
  ctx.restore();
}

function wrap(text, maxW) {
  const lines = []; let line = '';
  for (const w of text.split(' ')) {
    const test = line ? line + ' ' + w : w;
    if (line && ctx.measureText(test).width > maxW) { lines.push(line); line = w; } else line = test;
  }
  lines.push(line);
  return lines;
}

// ---------- phone UI kit (local coordinates inside the phone screen) ----------
const SW = 488, SH = 988, PAD = 24, CW = SW - PAD * 2;

function rr(x, y, w, h, r, fill, stroke, lw = 2) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function txt(s, x, y, size, weight, color, align = 'left') {
  font(weight, size); ctx.letterSpacing = '0px'; ctx.textAlign = align; ctx.fillStyle = color; ctx.fillText(s, x, y);
  return ctx.measureText(s).width;
}
function card(x, y, w, h, r = 20, stroke = C.line) {
  ctx.save();
  ctx.shadowColor = 'rgba(16,24,40,0.08)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 4;
  rr(x, y, w, h, r, '#FFFFFF');
  ctx.restore();
  rr(x, y, w, h, r, null, stroke);
}
function pill(x, y, label, bg, fg, size = 19, dot = null, align = 'left') {
  font(600, size);
  const w = ctx.measureText(label).width + 28 + (dot ? 18 : 0), h = size + 18;
  const x0 = align === 'right' ? x - w : x;
  rr(x0, y, w, h, h / 2, bg);
  if (dot) { ctx.fillStyle = dot; ctx.beginPath(); ctx.arc(x0 + 20, y + h / 2, 5, 0, Math.PI * 2); ctx.fill(); }
  txt(label, x0 + 14 + (dot ? 18 : 0), y + h / 2 + size * 0.36, size, 600, fg);
  return w;
}
function avatar(cx, cy, r, initials, bg, fg = '#FFFFFF') {
  ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.fill();
  txt(initials, cx, cy + r * 0.34, r * 0.82, 700, fg, 'center');
}
function stars(x, y, size, value, gap = 4) {
  for (let i = 0; i < 5; i++) {
    const cx = x + i * (size + gap) + size / 2;
    fillIcon('star', cx, y, size, '#E4E7EC');
    const f = clamp(value - i);
    if (f > 0) {
      ctx.save(); ctx.beginPath(); ctx.rect(cx - size / 2, y - size / 2, size * f, size); ctx.clip();
      fillIcon('star', cx, y, size, C.amber); ctx.restore();
    }
  }
  return 5 * (size + gap);
}
function pop(p, cx, cy, fn) {
  if (p <= 0) return;
  ctx.save();
  const s = lerp(0.8, 1, easeOutBack(p));
  ctx.globalAlpha *= clamp(p * 1.8);
  ctx.translate(cx, cy); ctx.scale(s, s); ctx.translate(-cx, -cy);
  fn(); ctx.restore();
}
function slide(p, dx, dy, fn) {
  if (p <= 0) return;
  ctx.save();
  const e = 1 - easeOutCubic(p);
  ctx.globalAlpha *= clamp(p * 1.8);
  ctx.translate(dx * e, dy * e);
  fn(); ctx.restore();
}
function tap(x, y, lt, at) {
  const p = seg(lt, at, at + 0.45);
  if (p <= 0 || p >= 1) return;
  ctx.save();
  ctx.fillStyle = `rgba(11,18,32,${0.18 * (1 - p)})`;
  ctx.beginPath(); ctx.arc(x, y, 18 + 46 * easeOutCubic(p), 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = `rgba(11,18,32,${0.35 * (1 - p)})`;
  ctx.beginPath(); ctx.arc(x, y, 16, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function sectionTitle(s, y) { txt(s, PAD, y, 25, 700, C.ink); }
function bizRow(y, name, meta, initials, color, status, statusColor = C.success, statusBg = C.successSoft) {
  card(PAD, y, CW, 108, 20);
  avatar(PAD + 54, y + 54, 32, initials, color);
  txt(name, PAD + 102, y + 46, 23, 700, C.ink);
  fillIcon('star', PAD + 111, y + 75, 17, C.amber);
  txt(meta, PAD + 126, y + 82, 19, 500, C.gray);
  if (status) pill(PAD + CW - 16, y + 58, status, statusBg, statusColor, 15, statusColor, 'right');
}

function drawPhone(x, y, w, h, content) {
  ctx.save();
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.55)'; ctx.shadowBlur = 70; ctx.shadowOffsetY = 30;
  rr(x, y, w, h, 72, '#0E1424');
  ctx.restore();
  rr(x, y, w, h, 72, null, '#2B3652', 4);
  rr(x - 5, y + 220, 6, 90, 3, '#2B3652');
  rr(w + x - 1, y + 260, 6, 130, 3, '#2B3652');
  // screen
  const sx = x + 16, sy = y + 16;
  ctx.save();
  ctx.beginPath(); ctx.roundRect(sx, sy, SW, SH, 58); ctx.clip();
  ctx.translate(sx, sy);
  ctx.fillStyle = C.canvas; ctx.fillRect(0, 0, SW, SH);
  content();
  // status bar + app bar stay on top of the content
  ctx.fillStyle = 'rgba(247,248,250,0.96)'; ctx.fillRect(0, 0, SW, 124);
  txt('9:41', 52, 40, 21, 700, C.ink);
  for (let i = 0; i < 4; i++) rr(SW - 128 + i * 9, 36 - i * 4, 6, 8 + i * 4, 1.5, C.ink);
  rr(SW - 78, 24, 38, 18, 5, null, C.ink, 2); rr(SW - 75, 27, 28, 12, 3, C.ink); rr(SW - 38, 30, 3, 7, 1, C.ink);
  drawLogo(PAD + 22, 90, 44, { glow: 0 });
  const w1 = txt('CallIn', PAD + 54, 99, 25, 800, C.ink);
  txt('Bell', PAD + 54 + w1, 99, 25, 800, C.amberDeep);
  avatar(SW - PAD - 22, 90, 22, 'VM', '#E4E9F2', C.ink2);
  ctx.fillStyle = C.line; ctx.fillRect(0, 123, SW, 1.5);
  ctx.restore();
  rr(x + w / 2 - 62, y + 30, 124, 36, 18, '#000000');
  ctx.restore();
}

// ---------- the ten phone screens (lt = seconds into the feature) ----------
const SCREENS = {
  discovery(lt) {
    card(PAD, 142, CW, 68, 34);
    drawIcon('search', PAD + 38, 176, 26, C.gray, 2.2);
    txt('Search businesses or services', PAD + 66, 184, 21, 500, C.faintUi);
    drawIcon('pin', PAD + 12, 240, 22, C.amberDeep, 2.2);
    txt('Banjara Hills, Hyderabad', PAD + 32, 248, 20, 600, C.ink2);
    sectionTitle('Popular categories', 300);
    const cats = [['zap', 'Electricians'], ['wrench', 'Plumbers'], ['snowflake', 'AC Repair'], ['hammer', 'Carpenters'], ['roller', 'Painters'],
                  ['sparkles', 'Cleaning'], ['washer', 'Appliances'], ['scissors', 'Salons'], ['book', 'Tutors']];
    const tw = (CW - 32) / 3, th = 128;
    cats.forEach(([icon, label], i) => {
      const x = PAD + (i % 3) * (tw + 16), y = 322 + Math.floor(i / 3) * (th + 14);
      pop(seg(lt, 0.25 + i * 0.06, 0.6 + i * 0.06), x + tw / 2, y + th / 2, () => {
        const sel = i === 0 && lt > 1.55;
        card(x, y, tw, th, 18, sel ? C.amber : C.line);
        ctx.fillStyle = C.accentSoft; ctx.beginPath(); ctx.arc(x + tw / 2, y + 50, 30, 0, Math.PI * 2); ctx.fill();
        drawIcon(icon, x + tw / 2, y + 50, 30, C.accentInk, 2);
        txt(label, x + tw / 2, y + 108, 18, 600, C.ink, 'center');
      });
    });
    tap(PAD + tw / 2, 372, lt, 1.4);
    sectionTitle('Electricians near you', 790);
    slide(seg(lt, 1.7, 2.1), 0, 40, () => bizRow(808, 'Sharma Electricals', '4.8 · 1.2 km away', 'SE', C.navy, 'Open now'));
  },

  aiSearch(lt) {
    const query = 'AC repair near me, open now';
    const n = Math.floor(query.length * seg(lt, 0.25, 1.05));
    card(PAD, 142, CW, 68, 34, C.amber);
    rr(PAD, 142, CW, 68, 34, null, C.amber, 3);
    drawIcon('search', PAD + 38, 176, 26, C.ink2, 2.2);

// ---------- background ----------
function drawBackground(t) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#0E1729'); g.addColorStop(0.55, C.navy); g.addColorStop(1, '#040A15');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const blob = (x, y, r, rgb, a) => {
    const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, `rgba(${rgb},${a})`); rg.addColorStop(1, `rgba(${rgb},0)`);
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  };
  blob(260 + 140 * Math.sin(t * 0.45), 520 + 120 * Math.cos(t * 0.38), 760, '244,166,44', 0.16);
  blob(860 + 90 * Math.cos(t * 0.5), 1500 + 140 * Math.sin(t * 0.33), 820, '21,112,239', 0.13);
  ctx.fillStyle = 'rgba(255,255,255,0.045)';
  const off = (t * 18) % 60;
  for (let y = -60 + off; y < H; y += 60)
    for (let x = 30; x < W; x += 60) { ctx.beginPath(); ctx.arc(x, y, 2, 0, Math.PI * 2); ctx.fill(); }
  for (let i = 0; i < 26; i++) {
    const sp = 30 + rand(i) * 70;
    const x = rand(i + 50) * W + Math.sin(t * 0.8 + i) * 18;
    const y = ((rand(i + 100) * (H + 200) - t * sp) % (H + 200) + H + 200) % (H + 200) - 100;
    ctx.fillStyle = `rgba(244,166,44,${0.12 + rand(i + 200) * 0.3})`;
    ctx.beginPath(); ctx.arc(x, y, 2 + rand(i + 150) * 4, 0, Math.PI * 2); ctx.fill();
  }
}

function drawRipples(cx, cy, lt, r0, spread, count = 3, lw = 4, maxA = 0.5) {
  if (lt < 0) return;
  for (let k = 0; k < count; k++) {
    const ph = lt * 0.85 - k * 0.28;
    if (ph < 0 || ph > 1) continue;
    ctx.strokeStyle = `rgba(244,166,44,${(1 - ph) * maxA})`;
    ctx.lineWidth = lw * (1 - ph * 0.5);
    ctx.beginPath(); ctx.arc(cx, cy, r0 + easeOutCubic(ph) * spread, 0, Math.PI * 2); ctx.stroke();
  }
}

// ---------- logo choreography ----------
const HEADER = { x: 118, y: 168, size: 104 };
const CENTER_INTRO = { x: 540, y: 820, size: 380 };
const CENTER_OUTRO = { x: 540, y: 560, size: 300 };

function logoState(t) {
  if (t < 2.75) {
    const p = easeOutBack(seg(t, 0.1, 0.85));
    return { x: CENTER_INTRO.x, y: CENTER_INTRO.y, size: CENTER_INTRO.size * p, ring: ringAngle(t - 0.85), waves: seg(t, 0.9, 1.5), glow: 1 };
  }
  if (t < T_OUT) {
    const p = easeInOutCubic(seg(t, 2.75, 3.4));
    let ring = 0;
    if (t >= T_FEAT && t < T_RECAP) ring = ringAngle(((t - T_FEAT) % FEAT_D) - 0.05) * 0.8;
    if (t >= T_RECAP) ring = ringAngle(t - T_RECAP - 0.1) * 0.8;
    return { x: lerp(CENTER_INTRO.x, HEADER.x, p), y: lerp(CENTER_INTRO.y, HEADER.y, p), size: lerp(CENTER_INTRO.size, HEADER.size, p), ring, waves: 1, glow: lerp(1, 0.5, p) };
  }
  const p = easeInOutCubic(seg(t, T_OUT, T_OUT + 0.75));
  return { x: lerp(HEADER.x, CENTER_OUTRO.x, p), y: lerp(HEADER.y, CENTER_OUTRO.y, p), size: lerp(HEADER.size, CENTER_OUTRO.size, p),
           ring: ringAngle(t - T_OUT - 0.75), waves: 1, glow: lerp(0.5, 1, p) };
}

  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  const f = 1 - seg(t, 0, 0.35);
  if (f > 0) { ctx.fillStyle = `rgba(4,8,16,${f})`; ctx.fillRect(0, 0, W, H); }
}

function renderFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.letterSpacing = '0px'; ctx.setLineDash([]);
  drawBackground(t);
  sceneIntro(t);
  sceneHook(t);
  sceneFeatures(t);
  sceneRecap(t);
  sceneOutro(t);
  drawHeader(t);
  drawProgress(t);
  const L = logoState(t);
  drawLogo(L.x, L.y, L.size, L);
  drawFinish(t);
}

window.REEL = { W, H, DUR, renderFrame };
window.reelReady = (async () => {
  await Promise.all([400, 500, 600, 700, 800, 900].map(w => document.fonts.load(`${w} 40px CBInter`)));
  renderFrame(0);
  return true;
})();

const params = new URLSearchParams(location.search);
if (params.has('render')) document.body.classList.add('render');
else window.reelReady.then(() => {
  const start = performance.now();
  const at = params.has('t') ? parseFloat(params.get('t')) : null;
  const loop = now => {
    renderFrame(at ?? ((now - start) / 1000) % DUR);
    if (at === null) requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
});
</script>
</body>
</html>
