<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070A10" />
  <title>You're offline · Calling Bell</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box;
      background: #080C14; color: #F4F6FA; font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; text-align: center; }
    @media (prefers-color-scheme: light) { :root { color-scheme: light; } body { background: #F7F8FA; color: #161616; } p { color: #667085 !important; } }
    main { max-width: 360px; }
    img { width: 72px; height: 72px; }
    h1 { margin: 20px 0 8px; font-size: 22px; }
    p { margin: 0 0 24px; color: #98A2B3; line-height: 1.5; }
    button { border: 0; border-radius: 10px; padding: 12px 22px; font: 600 15px inherit; font-family: inherit; background: #F4A62C; color: #0B1220; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/app-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Calling Bell needs an internet connection to show businesses, bookings and messages. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
