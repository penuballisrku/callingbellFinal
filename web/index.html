<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070A10" />
    <meta name="description" content="CallInBell - discover trusted local businesses, see who is available right now, request quotes and book services." />
    <!-- Google shows the site icon in results: a square raster icon of 48 px or more (favicon.ico holds 16, 32 and 48). -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Installable app ("Add to Home Screen"): manifest, iOS home screen icon and title. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="CallInBell" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>CallInBell - Discover. Connect. Book. Grow.</title>
    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash (mirrors stores/theme.ts).
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('cb-theme') || '{}');
          var s = saved.state || {};
          // Light is the default (stores/theme.ts DEFAULT_MODE); v0 stored "system" as the old default.
          var mode = !s.mode || ((saved.version || 0) < 1 && s.mode === 'system') ? 'light' : s.mode;
          var dark = mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          // Paint the canvas colour immediately, before any stylesheet has loaded.
          document.documentElement.style.backgroundColor = dark ? '#080C14' : '#F7F8FA';
          document.documentElement.dataset.accent = s.accent || 'amber';
        } catch (e) { document.documentElement.dataset.theme = 'light'; }
        // The server renders each page's content into #root for crawlers (data-prerendered). Browsers running this script hide it
        // until React renders the real page over it, so visitors don't see an unstyled version flash first. If the app hasn't
        // started after 8 seconds (a script failed to load), the content is shown after all.
        document.documentElement.classList.add('app-booting');
        setTimeout(function () { document.documentElement.classList.remove('app-booting'); }, 8000);
      })();
    </script>
    <style>html.app-booting [data-prerendered] { visibility: hidden; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
